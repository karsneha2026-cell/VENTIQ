
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | VENTIQ</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0a16;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border: 1px solid #373052;
            border-radius: 18px;
            background: #171427;
        }
        .logo {
            display: block;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            margin-bottom: 25px;
        }
        .logo span { color: #9865ff; }
        h1 { text-align: center; margin-bottom: 10px; }
        .subtitle {
            text-align: center;
            color: #aaa5c2;
            margin-bottom: 25px;
        }
        label { display: block; margin: 16px 0 8px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border-radius: 8px;
            border: 1px solid #41395d;
            background: #0e0c1b;
            color: white;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: 0;
            border-radius: 9px;
            background: #9865ff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .message { margin-top: 15px; text-align: center; }
        .auth-link, .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b89aff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="auth-card">
        <a href="index.html" class="logo">VEN<span>TIQ</span></a>
        <h1>Create Account</h1>
        <p class="subtitle">Join VENTIQ and discover new experiences.</p>

        <form id="registerForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            
<label for="password">Password</label>
<div style="position: relative;">
    <input type="password" id="password" name="password"
           placeholder="Create a password" minlength="8" required
           style="padding-right: 50px;">

    <button type="button" id="togglePassword"
            aria-label="Show password"
            style="position: absolute; right: 8px; top: 50%;
                   transform: translateY(-50%); width: auto;
                   margin: 0; padding: 5px; background: transparent;
                   color: #b89aff; font-size: 18px;">
        👁
    </button>
</div>


            <button type="submit">Create Account</button>
            <p id="message" class="message" role="status"></p>
        </form>

        <a href="login.html" class="auth-link">
            Already have an account? Log In
        </a>
        <a href="index.html" class="back-link">← Back to Home</a>
    </main>

    <script>
        const API_BASE = "http://127.0.0.1:5000";

        document.getElementById("registerForm").addEventListener(
            "submit", async function (event) {
                event.preventDefault();

                const message = document.getElementById("message");
                message.style.color = "#ffffff";
                message.textContent = "Creating your account...";

                try {
                    const response = await fetch(
                        `${API_BASE}/api/register`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                name: document.getElementById("name").value.trim(),
                                email: document.getElementById("email").value.trim(),
                                password: document.getElementById("password").value
                            })
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(result.error || result.message ||
                            "Registration failed.");
                    }

                    message.style.color = "#7fffb2";
                    message.textContent =
                        result.message || "Account created successfully!";

                } catch (error) {
                    message.style.color = "#ff8585";
                    message.textContent =
                        error.message === "Failed to fetch"
                        ? "Cannot connect to the server. Check that Flask is running."
                        : error.message;
                }
            }
        );
        
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "🙈" : "👁";
            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        });

    </script>
</body>
</html>
